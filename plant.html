<!DOCTYPE html>
<html>
<head>
    <title>Campus Plant Adoption</title>
</head>
<body>

    <h1>Adopt a Plant for Our Campus</h1>

    <p>Adopt a plant and help make our campus greener.</p>

    <h2>Available Plants</h2>

    <ul>
        <li>Neem</li>
        <li>Rose</li>
        <li>Jasmine</li>
    </ul>
<h2>Plant Adoption Form</h2>

<form>
    Student Name:
    <input type="text"><br><br>

    Select Plant:
    <select>
        <option>Neem</option>
        <option>Rose</option>
        <option>Jasmine</option>
    </select><br><br>

    <button>Adopt Plant</button>
</form>

</body>
</html>
